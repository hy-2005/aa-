<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Queue</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #fff;
            user-select: none;
            -webkit-app-region: no-drag;
        }

        .strip {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 100%;
            width: 100%;
            padding: 8px 14px;
            box-sizing: border-box;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.55) 0%, rgba(20, 20, 20, 0.65) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }

        .strip::-webkit-scrollbar { width: 0; height: 0; display: none; }
        .strip { scrollbar-width: none; -ms-overflow-style: none; }

        .hint {
            flex-shrink: 0;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.3;
            max-width: 150px;
        }

        .hint .title {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .hint .sub {
            opacity: 0.7;
            font-size: 10px;
        }

        .hint.error { color: #f87171; }
        .hint.error .sub { color: #fca5a5; }

        .thumb {
            position: relative;
            flex-shrink: 0;
            width: 140px;
            height: 86px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(0, 0, 0, 0.3);
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumb .badge {
            position: absolute;
            top: 4px;
            left: 4px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb.flash {
            animation: thumb-pop 280ms ease-out;
        }

        @keyframes thumb-pop {
            0%   { transform: scale(0.7); opacity: 0; }
            60%  { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .empty {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 6px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
        }

        .empty .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="strip" id="strip">
        <div class="hint" id="hint">
            <div class="title">截图队列</div>
            <div class="sub">Ctrl+Alt+S 截图 · Ctrl+Alt+D 发送 · Ctrl+Alt+X 清空</div>
        </div>
        <div class="empty" id="emptyHint" style="display:none;">
            <div class="dot"></div>
            <span>等待截图…</span>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const api = window.electronAPI;
            const strip = document.getElementById('strip');
            const hint = document.getElementById('hint');
            const emptyHint = document.getElementById('emptyHint');

            let queue = [];
            const MAX = 5;

            function renderHint(text, sub, isError) {
                hint.classList.toggle('error', !!isError);
                hint.innerHTML =
                    '<div class="title">' + escapeHtml(text) + '</div>' +
                    (sub ? '<div class="sub">' + escapeHtml(sub) + '</div>' : '');
            }

            function renderThumbs() {
                // Remove all existing .thumb nodes; hint + emptyHint stay.
                Array.from(strip.querySelectorAll('.thumb')).forEach((n) => n.remove());
                if (!queue.length) {
                    emptyHint.style.display = 'flex';
                    return;
                }
                emptyHint.style.display = 'none';
                queue.forEach((item) => {
                    const wrap = document.createElement('div');
                    wrap.className = 'thumb flash';
                    wrap.innerHTML =
                        '<img src="' + item.thumb + '" alt="shot" />' +
                        '<div class="badge">' + item.count + '</div>';
                    strip.appendChild(wrap);
                    // Drop the flash class so re-renders don't re-animate.
                    setTimeout(() => wrap.classList.remove('flash'), 300);
                });
                // Auto-scroll to the newest thumb.
                strip.scrollLeft = strip.scrollWidth;
            }

            function escapeHtml(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function onQueued(ev) {
                const { thumb, count } = ev || {};
                queue.push({ thumb: thumb || '', count: count || queue.length + 1 });
                renderHint(
                    '已截 ' + count + ' 张',
                    'Ctrl+Alt+D 发送给 AI · Ctrl+Alt+X 清空'
                );
                renderThumbs();
            }

            function onCleared() {
                queue = [];
                renderHint('截图队列', 'Ctrl+Alt+S 截图 · Ctrl+Alt+D 发送 · Ctrl+Alt+X 清空');
                renderThumbs();
            }

            function onSending(ev) {
                const c = (ev && ev.count) || queue.length;
                queue = [];
                renderHint('正在发送 ' + c + ' 张…', 'AI 正在分析截图', false);
                renderThumbs();
            }

            function onFull(ev) {
                const m = (ev && ev.max) || MAX;
                renderHint('已达上限 ' + m + ' 张', '请按 Ctrl+Alt+D 发送', true);
            }

            function onEmpty() {
                renderHint('队列为空', '先按 Ctrl+Alt+S 截图', false);
                queue = [];
                renderThumbs();
                setTimeout(() => {
                    if (!queue.length) {
                        renderHint('截图队列', 'Ctrl+Alt+S 截图 · Ctrl+Alt+D 发送 · Ctrl+Alt+X 清空');
                    }
                }, 2000);
            }

            function onRestored(ev) {
                const c = (ev && ev.count) || 0;
                renderHint('发送失败，已恢复 ' + c + ' 张', '可重试 Ctrl+Alt+D', true);
            }

            if (api) {
                if (api.onScreenshotQueued) api.onScreenshotQueued((_, ev) => onQueued(ev));
                if (api.onScreenshotQueueCleared) api.onScreenshotQueueCleared(() => onCleared());
                if (api.onScreenshotQueueSending) api.onScreenshotQueueSending((_, ev) => onSending(ev));
                if (api.onScreenshotQueueFull) api.onScreenshotQueueFull((_, ev) => onFull(ev));
                if (api.onScreenshotQueueEmpty) api.onScreenshotQueueEmpty(() => onEmpty());
                if (api.onScreenshotQueueRestored) api.onScreenshotQueueRestored((_, ev) => onRestored(ev));
            }
        })();
    </script>
</body>
</html>
